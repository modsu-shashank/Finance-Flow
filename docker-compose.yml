version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: financeflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: financeflow-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - mongodb
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeflow-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/finance_flow
      - JWT_SECRET=finance_flow_super_secret_jwt_key_2026_finance_tracker
      - JWT_EXPIRE=30d
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ai-service
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:

